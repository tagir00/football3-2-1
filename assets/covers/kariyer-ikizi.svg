<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Kariyer İkizi">
  <defs>
    <linearGradient id="kiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <radialGradient id="kiSpotA" cx="0.2" cy="0.55" r="0.5">
      <stop offset="0" stop-color="rgba(56,189,248,0.32)"/>
      <stop offset="1" stop-color="rgba(56,189,248,0)"/>
    </radialGradient>
    <radialGradient id="kiSpotB" cx="0.8" cy="0.55" r="0.5">
      <stop offset="0" stop-color="rgba(248,113,113,0.28)"/>
      <stop offset="1" stop-color="rgba(248,113,113,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#kiBg)"/>
  <rect width="400" height="300" fill="url(#kiSpotA)"/>
  <rect width="400" height="300" fill="url(#kiSpotB)"/>

  <!-- Two player silhouettes facing each other -->
  <g fill="#38bdf8" fill-opacity="0.9">
    <circle cx="72" cy="118" r="22"/>
    <path d="M36 196 C36 160 52 146 72 146 C92 146 108 160 108 196 Z"/>
  </g>
  <g fill="#f87171" fill-opacity="0.9">
    <circle cx="328" cy="118" r="22"/>
    <path d="M292 196 C292 160 308 146 328 146 C348 146 364 160 364 196 Z"/>
  </g>

  <!-- Middle stat column, like the TV board -->
  <g font-family="'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="140" y="72" width="120" height="136" rx="12" fill="rgba(163,230,53,0.08)" stroke="#a3e635" stroke-opacity="0.6"/>
    <g font-size="9" font-weight="800" letter-spacing="1" fill="#94a3b8">
      <text x="200" y="92">PL MAÇI</text>
      <text x="200" y="136">MİLLİ MAÇ</text>
      <text x="200" y="180">TOPLAM KUPA</text>
    </g>
    <g font-size="17" font-weight="900" fill="#f8fafc">
      <text x="200" y="112">254</text>
      <text x="200" y="156">105</text>
      <text x="200" y="200">17</text>
    </g>
    <g font-size="15" font-weight="900">
      <text x="118" y="112" fill="#a3e635">≈</text>
      <text x="282" y="156" fill="#a3e635">≈</text>
      <text x="118" y="200" fill="#a3e635">≈</text>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="200" y="46" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" fill="#a3e635" text-anchor="middle">KARİYER</text>
  <text x="200" y="266" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" letter-spacing="1.5" fill="#f1f5f9" text-anchor="middle">İKİZİ</text>
</svg>
