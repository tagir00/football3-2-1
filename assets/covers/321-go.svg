<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="3-2-1 GO">
  <defs>
    <linearGradient id="c1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#132444"/>
    </linearGradient>
    <!-- Text gradients use userSpaceOnUse: iOS Safari drops objectBoundingBox
         gradients on <text> when the SVG is loaded via <img>. -->
    <linearGradient id="c1warm" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="205">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="c1two" gradientUnits="userSpaceOnUse" x1="0" y1="105" x2="0" y2="195">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="c1one" gradientUnits="userSpaceOnUse" x1="0" y1="115" x2="0" y2="185">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="c1spot" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="rgba(249,115,22,0.30)"/>
      <stop offset="1" stop-color="rgba(249,115,22,0)"/>
    </radialGradient>
    <linearGradient id="c1sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#c1bg)"/>
  <rect width="400" height="300" fill="url(#c1spot)"/>

  <!-- pitch lines subtle -->
  <g stroke="#38bdf8" stroke-opacity="0.08" fill="none" stroke-width="1">
    <line x1="0" y1="235" x2="400" y2="235"/>
    <line x1="0" y1="65"  x2="400" y2="65"/>
  </g>

  <!-- Centered 3 2 1 with size cascade -->
  <g font-family="'Segoe UI', 'Trebuchet MS', sans-serif" font-weight="900" text-anchor="middle">
    <!-- solid fallback underneath, gradient on top -->
    <text x="112" y="150" dy="0.35em" font-size="150" fill="#fb923c">3</text>
    <text x="112" y="150" dy="0.35em" font-size="150" fill="url(#c1warm)">3</text>
    <text x="205" y="150" dy="0.35em" font-size="120" fill="#cbd5e1" opacity="0.85">2</text>
    <text x="205" y="150" dy="0.35em" font-size="120" fill="url(#c1two)" opacity="0.85">2</text>
    <text x="278" y="150" dy="0.35em" font-size="95" fill="#a3b1c4" opacity="0.7">1</text>
    <text x="278" y="150" dy="0.35em" font-size="95" fill="url(#c1one)" opacity="0.7">1</text>
  </g>

  <!-- GO! pill centered below -->
  <g>
    <rect x="148" y="228" rx="24" ry="24" width="104" height="48" fill="#22c55e"/>
    <rect x="148" y="228" rx="24" ry="24" width="104" height="22" fill="url(#c1sheen)" opacity="0.4"/>
    <text x="200" y="261" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#041a0b" text-anchor="middle">GO!</text>
  </g>

  <!-- Football top-right -->
  <g transform="translate(348 50)">
    <circle r="22" fill="#f8fafc"/>
    <circle r="22" fill="none" stroke="#0a1224" stroke-width="2" opacity="0.55"/>
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#0a1224"/>
    <g stroke="#0a1224" stroke-width="1.6" fill="none" opacity="0.7">
      <line x1="0" y1="-12" x2="0" y2="-22"/>
      <line x1="11" y1="-4" x2="20" y2="-10"/>
      <line x1="-11" y1="-4" x2="-20" y2="-10"/>
      <line x1="7" y1="10" x2="12" y2="19"/>
      <line x1="-7" y1="10" x2="-12" y2="19"/>
    </g>
  </g>
</svg>
