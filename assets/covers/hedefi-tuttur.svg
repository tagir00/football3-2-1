<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hedefi Tuttur">
  <defs>
    <linearGradient id="htBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#0b1f2e"/>
    </linearGradient>
    <!-- userSpaceOnUse: iOS Safari drops objectBoundingBox gradients on <text> in <img> -->
    <linearGradient id="htGreen" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="44">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="htLime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="htSpot" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(74,222,128,0.35)"/>
      <stop offset="1" stop-color="rgba(74,222,128,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#htBg)"/>
  <rect width="400" height="300" fill="url(#htSpot)"/>

  <!-- subtle pitch lines -->
  <g stroke="#4ade80" stroke-opacity="0.08" fill="none" stroke-width="1">
    <line x1="0" y1="70"  x2="400" y2="70"/>
    <line x1="0" y1="230" x2="400" y2="230"/>
  </g>

  <!-- Target rings, off-center -->
  <g transform="translate(120 165)">
    <circle r="88" fill="none" stroke="rgba(74,222,128,0.18)" stroke-width="2"/>
    <circle r="66" fill="none" stroke="rgba(74,222,128,0.28)" stroke-width="2"/>
    <circle r="44" fill="none" stroke="rgba(74,222,128,0.40)" stroke-width="2"/>
    <circle r="22" fill="none" stroke="url(#htLime)" stroke-width="3"/>
    <circle r="6"  fill="url(#htLime)"/>
    <!-- crosshairs -->
    <g stroke="rgba(74,222,128,0.55)" stroke-width="1.5">
      <line x1="-98" y1="0" x2="-72" y2="0"/>
      <line x1="72"  y1="0" x2="98"  y2="0"/>
      <line x1="0" y1="-98" x2="0" y2="-72"/>
      <line x1="0" y1="72"  x2="0" y2="98"/>
    </g>
  </g>

  <!-- Arrow hitting bullseye -->
  <g transform="translate(120 165) rotate(-28)">
    <line x1="-6" y1="0" x2="120" y2="0" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
    <polygon points="-14,0 -4,-5 -4,5" fill="#f8fafc"/>
    <polygon points="118,-5 130,0 118,5" fill="#f8fafc"/>
  </g>

  <!-- Numeric target chip -->
  <g transform="translate(280 100)">
    <rect x="-52" y="-30" width="104" height="60" rx="14" fill="rgba(8,15,30,0.7)" stroke="url(#htLime)" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="10" letter-spacing="2" fill="#4ade80" text-anchor="middle">HEDEF</text>
    <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#ecfeff" text-anchor="middle">750</text>
  </g>

  <!-- Wordmark -->
  <text x="200" y="44" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" fill="#4ade80" text-anchor="middle">HEDEFİ</text>
  <text x="200" y="44" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" fill="url(#htGreen)" text-anchor="middle">HEDEFİ</text>
  <text x="200" y="278" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="32" letter-spacing="1.5" fill="#f1f5f9" text-anchor="middle">TUTTUR</text>
</svg>
