<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Draft6">
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0d1c37"/>
    </linearGradient>
    <linearGradient id="c2cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="c2spot" cx="0.3" cy="0.35" r="0.7">
      <stop offset="0" stop-color="rgba(56,189,248,0.30)"/>
      <stop offset="1" stop-color="rgba(56,189,248,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#c2bg)"/>
  <rect width="400" height="300" fill="url(#c2spot)"/>

  <!-- Big 6 -->
  <text x="30" y="230" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="240" fill="url(#c2cool)">6</text>

  <!-- Player slot pips: 3 columns x 2 rows on the right -->
  <g transform="translate(215 60)">
    <g fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)" stroke-width="1">
      <rect x="0"   y="0"   width="50" height="60" rx="8"/>
      <rect x="60"  y="0"   width="50" height="60" rx="8"/>
      <rect x="120" y="0"   width="50" height="60" rx="8"/>
      <rect x="0"   y="72"  width="50" height="60" rx="8"/>
      <rect x="60"  y="72"  width="50" height="60" rx="8"/>
      <rect x="120" y="72"  width="50" height="60" rx="8"/>
    </g>
    <!-- head + jersey silhouettes -->
    <g fill="rgba(125,211,252,0.75)">
      <circle cx="25"  cy="18" r="6"/>
      <circle cx="85"  cy="18" r="6"/>
      <circle cx="145" cy="18" r="6"/>
      <circle cx="25"  cy="90" r="6"/>
      <circle cx="85"  cy="90" r="6"/>
      <circle cx="145" cy="90" r="6"/>
    </g>
    <g fill="rgba(125,211,252,0.55)">
      <rect x="14"  y="30" width="22" height="18" rx="3"/>
      <rect x="74"  y="30" width="22" height="18" rx="3"/>
      <rect x="134" y="30" width="22" height="18" rx="3"/>
      <rect x="14"  y="102" width="22" height="18" rx="3"/>
      <rect x="74"  y="102" width="22" height="18" rx="3"/>
      <rect x="134" y="102" width="22" height="18" rx="3"/>
    </g>
  </g>

  <!-- DRAFT wordmark -->
  <text x="215" y="245" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#f8fafc">DRAFT</text>
</svg>
