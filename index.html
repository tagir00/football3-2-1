<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Oyun Kutusu: Birden fazla mini oyun barindiran mobil parti uygulamasi."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />
    <title>Oyun Kutusu</title>
    <link rel="stylesheet" href="./src/shell.css" />
    <link rel="stylesheet" href="./src/themes.css" />
  </head>
  <body data-theme="stadium">
    <div class="app-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="ambient ambient-c"></div>

      <div class="theme-layer" aria-hidden="true">
        <div class="theme-stadium">
          <div class="pitch-mow"></div>
          <div class="pitch-vignette"></div>
          <div class="pitch-arc"></div>
          <div class="pitch-circle"></div>
          <div class="pitch-halfway"></div>
          <div class="pitch-dot"></div>
        </div>
        <div class="theme-tactic">
          <div class="tactic-frame"></div>
          <div class="tactic-midline"></div>
          <div class="tactic-midcircle"></div>
          <div class="tactic-dot tactic-dot-green tactic-dot-1"></div>
          <div class="tactic-dot tactic-dot-cyan tactic-dot-2"></div>
          <div class="tactic-dot tactic-dot-cyan tactic-dot-3"></div>
          <div class="tactic-dot tactic-dot-green tactic-dot-4"></div>
        </div>
      </div>

      <header class="topbar">
        <a class="topbar-brand" href="#/">Oyun Kutusu</a>
      </header>

      <main class="app">
        <div id="hubRoot"></div>
        <div id="gameRoot" class="hidden"></div>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
